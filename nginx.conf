server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text-based assets — cheap win, noticeably smaller transfer size.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived caching for hashed build assets (Vite fingerprints filenames,
    # e.g. index-D0prvQj-.js, so it's always safe to cache these aggressively —
    # a new build produces a new filename, never a stale cache collision).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other route falls back to index.html. This site is a single-page
    # app that scrolls between #hero/#about/#projects anchors rather than
    # using client-side routing, but this fallback is kept in place so any
    # future router (React Router, etc.) works without a config change, and
    # so a direct request to an unknown path doesn't hit a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html itself — it references the hashed asset
    # filenames, so it needs to always be fetched fresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
