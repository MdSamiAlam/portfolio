# ==============================================================================
# CD — Continuous Delivery (Docker image)
# Builds the image described by ./Dockerfile and pushes it to GitHub
# Container Registry (ghcr.io) — free, and already authenticated via
# GITHUB_TOKEN, so no external registry account is needed.
#
# This only runs after the CI workflow has *finished successfully* on main —
# `workflow_run` is how one workflow waits on another, instead of both
# racing to run off the same push event.
# ==============================================================================
name: Publish Docker image

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Guard clause: only proceed if the CI run this was triggered by actually
    # succeeded. Without this, a failed CI run would still trigger this
    # workflow (workflow_run fires on completion, success or failure).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Grants this job permission to push to GHCR using the repo's built-in
    # GITHUB_TOKEN — without this block the push step gets a 403.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU + Buildx enable multi-platform builds (e.g. linux/amd64 +
      # linux/arm64 in one push) and are the standard modern way to build
      # Docker images in Actions, replacing the plain `docker build` CLI.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs in to GHCR using the automatically-provided GITHUB_TOKEN —
      # scoped to this repo, expires when the job ends, nothing to rotate.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes image tags/labels from repo metadata. `type=sha` tags each
      # build with its commit hash (so you can always trace an image back to
      # exact source); the "latest" tag is added automatically on the
      # default branch by docker/metadata-action.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Builds using the same Dockerfile from Milestone 8, and pushes the
      # result straight to GHCR — this is the actual "deploy the image"
      # step; running it somewhere (a server, a host) is Milestone 10.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
